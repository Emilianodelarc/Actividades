<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividades</title>
  <style>
    body { margin: 0; padding: 24px 16px; font-family: "Source Sans 3", SourceSansPro, sans-serif; background: #F7F7F7; color: #222; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 28px; }
    .card { background: #FFF; border: 1px solid #DDD; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .langs button { font-size: 15px; padding: 6px 12px; margin-right: 6px; border: 1px solid #CCC; border-radius: 4px; background: #FFF; cursor: pointer; }
    .langs button.activo { background: #1E3A5F; color: #FFF; border-color: #1E3A5F; }
    iframe { width: 100%; height: 640px; border: 1px solid #DDD; border-radius: 6px; margin-top: 12px; background: #FFF; }
  </style>
</head>
<body>
  <main>
    <h1>Actividades</h1>
    <div class="card" data-actividad="01-mi-primer-header">
      <h2>01 · Mi primer header</h2>
      <div class="langs">
        <button data-lang="es" class="activo">Español</button>
        <button data-lang="en">English</button>
        <button data-lang="pt">Português</button>
      </div>
      <iframe src="01-mi-primer-header/es/index.html" title="Actividad 01"></iframe>
    </div>
  </main>
  <script>
    document.querySelectorAll('.card').forEach(card => {
      const iframe = card.querySelector('iframe');
      card.querySelectorAll('.langs button').forEach(btn => {
        btn.addEventListener('click', () => {
          card.querySelectorAll('.langs button').forEach(b => b.classList.remove('activo'));
          btn.classList.add('activo');
          iframe.src = `${card.dataset.actividad}/${btn.dataset.lang}/index.html`;
        });
      });
    });
  </script>
</body>
</html>
